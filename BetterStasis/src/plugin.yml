name: BetterStasis
version: '1.4.1-horus'
main: dev.xoperr.betterstasis.BetterStasisPlugin
api-version: '1.21'
description: Better stasis chamber system (fork HORUS, compile contre Paper 26.1.2, sans Vault)
author: xoperr

commands:
  pearlshare:
    description: Share your bound fishing rod with another player
    usage: /pearlshare <player>
    permission: betterstasis.share
  pearlunshare:
    description: Unshare your bound fishing rod from a player
    usage: /pearlunshare <player>
    permission: betterstasis.share
  pearlshared:
    description: List players who can use your bound fishing rod
    usage: /pearlshared
    permission: betterstasis.share
  pearltoggle:
    description: Toggle visibility of binding information on your rod
    usage: /pearltoggle
    permission: betterstasis.toggle

permissions:
  betterstasis.share:
    description: Allows sharing bound fishing rods with other players
    default: true
  betterstasis.toggle:
    description: Allows toggling visibility of rod binding information
    default: true
