name: KamoofLite
version: '3.6'
main: kamoof.KamoofLite
api-version: '1.21'
author: Claude
description: Drop ta tete a la mort, transforme-toi en clic-droit, et rituel des tetes (style Kamoof SMP).
commands:
  undisguise:
    description: Reprends ton apparence d'origine.
    usage: /undisguise
  ritual:
    description: Rituel des tetes (setup admin + acceptation de pacte).
    usage: /ritual <setup|place x y z|livre|pacte 1|2>
  tpspawn:
    description: Se teleporter au spawn du serveur.
    usage: /tpspawn
  portal:
    description: Pose le grand portail du Nether decore, oriente vers l'autel du rituel.
    usage: /portal spawn <x> <y> <z>
permissions:
  kamooflite.admin:
    description: Administrateur KamoofLite (setup du rituel).
    default: op
