name: SuperSlip
version: '1.1'
main: superslip.SuperSlip
api-version: '1.21'
author: Claude
description: Ajoute un slip sur la tete des joueurs.
commands:
  slip:
    description: Enfiler ou retirer le slip. /slip on|off (op) pour activer/desactiver, /slip <joueur|all> (op) pour les autres.
    usage: /slip [on|off|joueur|all]
